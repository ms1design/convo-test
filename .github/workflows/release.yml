name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (optional, bumps patch if unset)'
        required: false
        default: ''
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Bump version and create release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - run: uv venv && uv pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y jq

      - id: get_version
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            current=$(jq -r '.version' custom_components/nexus_conversation/manifest.json)
            IFS='.' read -r MAJOR MINOR PATCH <<< "${current:-0.0.0}"
            PATCH=$((PATCH + 1))
            version="$MAJOR.$MINOR.$PATCH"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update manifest.json
        run: |
          jq --arg ver "${{ steps.get_version.outputs.version }}" '.version = $ver' \
            custom_components/nexus_conversation/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json custom_components/nexus_conversation/manifest.json
          git add custom_components/nexus_conversation/manifest.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update version to ${{ steps.get_version.outputs.version }} [skip ci]"
          fi

      - name: Push
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git
          git push origin HEAD
          TAG="v${{ steps.get_version.outputs.version }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG" && git push origin "$TAG"
          fi

      - uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GH_PAT }}
          name: "v${{ steps.get_version.outputs.version }}"
          tag: "v${{ steps.get_version.outputs.version }}"
          body: "Release v${{ steps.get_version.outputs.version }}"
          generate-release-notes: true
